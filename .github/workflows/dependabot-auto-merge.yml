name: Dependabot auto-merge

on: pull_request

permissions: {}

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # The PR author, not github.actor: a human re-running the workflow on a Dependabot PR
    # changes the actor, and a human pushing to a Dependabot branch must not keep auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: metadata
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Merge only patch and minor bumps, and no minor bump of a 0.x dependency (under
      # semver a 0.x minor may break). Checked per dependency, so one risky update in a
      # grouped PR keeps the whole PR for a human.
      - name: Decide
        id: decide
        env:
          UPDATES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          eligible=$(jq -r '
            length > 0 and all(.[];
              .updateType == "version-update:semver-patch" or
              (.updateType == "version-update:semver-minor" and ((.prevVersion // "0.") | ltrimstr("v") | startswith("0.") | not))
            )' <<<"$UPDATES")
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "\(.dependencyName) \(.prevVersion) -> \(.newVersion) (\(.updateType))"' <<<"$UPDATES"
          echo "auto-merge eligible: $eligible"

      - name: Enable auto-merge
        if: steps.decide.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
