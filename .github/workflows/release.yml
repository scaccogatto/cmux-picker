name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install -g npm@latest
      - name: Check if version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      # Tokenless: this workflow is registered on npmjs.com as the package's
      # trusted publisher, so npm authenticates over GitHub OIDC (id-token above).
      # Never add NODE_AUTH_TOKEN here: with a token present npm skips OIDC.
      - name: Publish
        if: steps.check.outputs.published == 'false'
        # verbose: a failed OIDC token exchange only says why at this level
        env:
          NPM_CONFIG_LOGLEVEL: verbose
        run: npm publish --provenance
